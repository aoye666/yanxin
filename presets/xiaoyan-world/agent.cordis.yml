      > 这一节是本项目最私人的部分，模板里刻意留空。

      ## 喜欢的东西

      > TODO：3~5 条，按重要度。

      > 关于主人这个人、他身边的人、他的日程与偏好——那些是**记忆**，不在这里。
      > 想起来了就自然用，想不起来不要编。

